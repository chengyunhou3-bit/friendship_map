[app]
# 本機測試時使用 "local"；公開部署時改為 "cloud"。
mode = "cloud"

[auth]
redirect_uri = "https://你的網址.streamlit.app/oauth2callback"
cookie_secret = "請換成一段隨機產生的長字串"
client_id = "Google OAuth Client ID"
client_secret = "Google OAuth Client Secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[supabase]
url = "https://你的專案.supabase.co"
# 只能放在 Streamlit Secrets，絕對不可上傳到 GitHub。
service_key = "Supabase service_role key"
