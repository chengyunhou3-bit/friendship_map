<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241b63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="關係座標">
  <title>安裝人際關係座標圖</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
  <link rel="manifest" href="site.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #120d32;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 22px;
      background:
        radial-gradient(circle at 20% 15%, #523ab3 0, transparent 38%),
        radial-gradient(circle at 90% 85%, #194b8e 0, transparent 35%),
        #120d32;
    }
    main {
      width: min(100%, 420px);
      padding: 30px 24px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      text-align: center;
      background: rgba(25,18,67,.76);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }
    img {
      width: 116px;
      height: 116px;
      border-radius: 25px;
      box-shadow: 0 16px 38px rgba(0,0,0,.35);
    }
    h1 { margin: 22px 0 10px; font-size: 28px; }
    p { margin: 0 0 22px; color: #d9d3ff; line-height: 1.65; }
    .instruction {
      margin: 22px 0;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.08);
      color: #fff;
      line-height: 1.6;
    }
    a {
      display: block;
      padding: 15px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff4f79, #7865ff);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    small { display: block; margin-top: 16px; color: #aaa2d8; }
  </style>
</head>
<body>
  <main>
    <img src="app-icon-192.png" alt="人際關係座標圖圖示">
    <h1>人際關係座標圖</h1>
    <p>把網站放到手機主畫面，下次就能像 App 一樣直接開啟。</p>
    <div class="instruction" id="instruction">
      iPhone：點 Safari 下方的「分享」，再選「加入主畫面」。
    </div>
    <a href="/">先開啟網站</a>
    <small>加入主畫面後仍需網路連線</small>
  </main>
  <script>
    const standalone = window.navigator.standalone === true
      || window.matchMedia("(display-mode: standalone)").matches;

    if (standalone) {
      window.location.replace("/");
    }

    if (/Android/i.test(navigator.userAgent)) {
      document.getElementById("instruction").textContent =
        "Android：點 Chrome 右上角選單，再選「加到主畫面」或「安裝應用程式」。";
    }
  </script>
</body>
</html>
